# Ajustado para máquina com 4 GB de RAM total.
# -Xmx1024m: Gradle cabe em 1 GB de heap; 1536m+ causa swap/trashing em 4 GB.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=320m -XX:+UseSerialGC -Dfile.encoding=UTF-8
# workers.max=1 + parallel=false evitam duas JVMs simultâneas (Gradle + Kotlin daemon).
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.daemon=false
org.gradle.configureondemand=true
android.enableR8.fullMode=false
# Kotlin no processo do Gradle: sem JVM extra do Kotlin daemon (crítico em 4 GB).
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx256m
kotlin.incremental=true
android.useAndroidX=true
android.nonTransitiveRClass=true
