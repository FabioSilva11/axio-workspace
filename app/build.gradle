plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // Registrado sem aplicar: a aplicação é condicional ao google-services.json
    id 'com.google.gms.google-services' apply false
}

// O google-services.json é privado (não versionado). O plugin só é aplicado
// quando o arquivo existe, permitindo compilar sem a configuração do Firebase;
// o Analytics fica inativo e o restante do app funciona normalmente.
def googleServicesJson = file('google-services.json')
if (googleServicesJson.exists()) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.warn('google-services.json não encontrado: compilando sem Firebase.')
}

android {
    namespace 'com.saaspaymentsolutions.axion'
    compileSdk 35

    defaultConfig {
        applicationId "com.saaspaymentsolutions.axion"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "1.1"

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            // Only wire the signing config when credentials are present; a debug
            // build or CI without secrets must not fail with a null storeFile.
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                storeFile file(project.property('RELEASE_STORE_FILE'))
                storePassword project.property('RELEASE_STORE_PASSWORD')
                keyAlias project.property('RELEASE_KEY_ALIAS')
                keyPassword project.property('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // Wire signing only when configured; otherwise assembleRelease
            // produces an unsigned APK instead of crashing on null storeFile.
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    sourceSets {
        test {
            java {
                // Testes de um módulo de resolução de dependências cujas classes
                // de produção ainda não existem no app; sem isso eles quebram a
                // compilação de TODO o pacote de testes. Reverta quando a feature pousar.
                exclude 'com/saaspaymentsolutions/axion/dependencies/**'
                exclude 'com/saaspaymentsolutions/axion/BuildProgressParserTest.java'
            }
        }
    }

    packaging {
        resources {
            excludes += [
                'META-INF/AL2.0',
                'META-INF/LGPL2.1',
                'META-INF/licenses/**',
                'META-INF/DEPENDENCIES',
                'META-INF/NOTICE',
                'META-INF/NOTICE.md',
                'META-INF/LICENSE',
                'META-INF/LICENSE.md',
                'META-INF/LICENSE-notice.md',
                'META-INF/*.md',
                'META-INF/*.markdown',
                'META-INF/*.SF',
                'META-INF/*.RSA',
                'META-INF/*.DSA',
                'META-INF/versions/**'
            ]
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // 1.14-alpha é intencional: os temas do app usam Material3Expressive,
    // ainda não presente na linha estável 1.12/1.13.
    implementation 'com.google.android.material:material:1.14.0-alpha05'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.paging:paging-runtime:3.5.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'com.caverock:androidsvg-aar:1.4'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.transition:transition:1.4.1'
    implementation 'androidx.preference:preference:1.2.1'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation platform('com.google.firebase:firebase-bom:34.16.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'dev.chrisbanes.insetter:insetter:0.6.1'
    implementation 'io.github.Rosemoe.sora-editor:editor:0.23.4'

    // Testes unitários
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
