pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        id 'com.android.application' version '8.6.0'
        // Kotlin 2.3.21: o play-services-ads:25.4.0 publica metadata Kotlin 2.3.0,
        // ilegivel pelo compilador 2.1.x. So o build host (do proprio Axion) usa
        // esta versao; o compilador on-device continua o port 2.1.21 embutido.
        id 'org.jetbrains.kotlin.android' version '2.3.21'
        id 'com.google.gms.google-services' version '4.4.2'
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

rootProject.name = "Axion"
include ':app'
